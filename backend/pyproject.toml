[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "C4"]
ignore = ["S101"]  # asserts are fine in tests; production code does not use them

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "BLE001"]
"config/settings/test.py" = ["S105", "S106"]
# Action names such as "user.password_changed" are labels, not credentials.
"apps/audit/actions.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apps.core.*", "apps.accounts.*", "apps.audit.*", "config.*"]
strict = true
disallow_untyped_decorators = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "apps.accounts.migrations.*", "apps.audit.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real PostgreSQL/Redis (and optionally a Celery worker)",
    "security: attack-oriented tests of authentication, authorisation and token handling",
    "timing: statistical timing comparison (many samples, medians, generous bound)",
]

[tool.coverage.run]
source = ["apps/core", "apps/accounts", "apps/audit", "config"]
omit = ["config/asgi.py", "config/wsgi.py", "apps/accounts/migrations/*", "apps/audit/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
