name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

# Actions are pinned by commit SHA (checkout v7.0.1, setup-python v7.0.0, upload-artifact v7.0.2,
# gitleaks-action v3.0.0). Dependabot keeps them current. The service images (postgres:16, redis:7)
# are pinned to a major line only.
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes -r backend/requirements/dev.txt
      - working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy .

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent-dev-only   # CI-only throwaway value
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes -r backend/requirements/dev.txt
      - name: Unit tests (no services needed)
        working-directory: backend
        run: python -m pytest -q -m "not integration"
      - name: Full suite with coverage (includes real Postgres, Redis and Celery worker/beat)
        working-directory: backend
        run: python -m pytest -q --cov --cov-fail-under=90 --cov-report=xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-xml
          path: backend/coverage.xml

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent-dev-only
          POSTGRES_DB: agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes -r backend/requirements/dev.txt
      - working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput

  deploy-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/prod.txt
      - run: pip install --require-hashes -r backend/requirements/prod.txt
      - name: check --deploy with a throwaway generated environment
        working-directory: backend
        run: |
          set -a
          eval "$(python scripts/gen_throwaway_env.py)"
          set +a
          DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py check --deploy --fail-level WARNING

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes -r backend/requirements/dev.txt
      - name: bandit
        working-directory: backend
        run: bandit -r apps config -ll
      - name: pip-audit (any known vulnerability with a fix fails; exceptions live in docs/phase-1/DECISIONS.md)
        working-directory: backend
        run: pip-audit -r requirements/prod.txt -r requirements/dev.txt --require-hashes
      - name: secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -f docker/Dockerfile -t calling-agent-api:ci .
      - name: Runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id calling-agent-api:ci -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Compose smoke test
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker/compose.dev.yml up -d --build
          code=000
          for i in $(seq 1 36); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz || true)"
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "readyz=$code"
          test "$code" = "200"
          for i in $(seq 1 24); do
            docker compose --env-file .env -f docker/compose.dev.yml logs worker | grep -q '"message": "heartbeat"' && exit 0
            sleep 5
          done
          echo "heartbeat not observed"; exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env -f docker/compose.dev.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose --env-file .env -f docker/compose.dev.yml down -v

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/dev.txt
      - run: pip install --require-hashes -r backend/requirements/dev.txt
      - name: API contract check (informational for unimplemented paths; fails on drift)
        working-directory: backend
        run: python scripts/check_api_contract.py
