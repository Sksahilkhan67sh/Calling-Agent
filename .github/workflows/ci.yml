name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: calling, POSTGRES_PASSWORD: calling, POSTGRES_DB: calling}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calling" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: check --deploy
        run: python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-ci-only-not-a-real-secret-key-0123456789
          JWT_SIGNING_KEY: ci-only-jwt-signing-key-0123456789abcdef0123456789
          DJANGO_ALLOWED_HOSTS: api.example.com
          PRIMARY_DB_URL: postgres://calling:calling@localhost:5432/calling
          PRIMARY_DB_POOL_SIZE: "5"
          CORS_ALLOWED_ORIGINS: https://app.example.com
          CALL_QUEUE_BROKER_URL: redis://localhost:6379/0
          CACHE_URL: redis://localhost:6379/1
          API_RATE_LIMIT_PER_MINUTE: "1000"
          AXES_FAILURE_LIMIT: "5"
          TRUSTED_PROXY_COUNT: "1"
          FIELD_ENCRYPTION_KEYS: egsE0xEKI-D7TSQjfs-ner_qJpnp-bjBFoj4th8G9ek=
          PHONE_HMAC_KEY: ci-only-phone-hmac-key
          DOGRAH_BASE_URL: https://dograh.example.com
          DOGRAH_API_KEY: ci-only-dograh-key
          DOGRAH_REQUEST_TIMEOUT_SECONDS: "10"
          DOGRAH_ALLOWED_ARTIFACT_HOSTS: artifacts.example.com
          DOGRAH_MAX_ARTIFACT_BYTES: "104857600"
          DOGRAH_ARTIFACT_DEADLINE_SECONDS: "60"
          DOGRAH_RUN_PATH: /api/v1/runs
          DOGRAH_WORKFLOW_PATH: /api/v1/agents
          PUBLIC_BASE_URL: https://api.example.com
          DOGRAH_WEBHOOK_SECRET: ci-only-webhook-secret-ci-only-webhook-secret
          DOGRAH_EFFECTIVE_CONCURRENCY: "10"
          DOGRAH_COMPLETED_DISPOSITIONS: goal_met
          RECONCILE_CEILING_SECONDS: "900"
          WEBHOOK_RATE_LIMIT_PER_MINUTE: "1000"
      - run: bandit -q -ll -r apps config
      - run: pip-audit -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
